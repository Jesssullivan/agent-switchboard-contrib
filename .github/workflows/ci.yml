name: CI

# Required check: `ci-ok` (ruleset on main, merge queue MERGE / one entry
# built at a time / ALLGREEN). ADR-0001, SWB-R13:
#
# - Same-repository pull requests, merge_group and push to main run the full
#   xoxd-ai/ci-templates rust-bazel-application lane on GloriousFlywheel
#   private runners, and `ci-ok` aggregates it.
# - Fork pull requests (for example Jesssullivan/agent-switchboard-contrib -> main)
#   are GATED IN MERGE QUEUE. The template refuses fork pull requests on
#   private runners (contract.py: "fork pull requests cannot receive private
#   native runners"), and the estate forbids hosted runners. So on a fork pull
#   request both jobs below are skipped, no runner is scheduled, and GitHub
#   reports the skipped required `ci-ok` as passing. The full lane then runs
#   on the merge_group event, where `ci-ok` must pass for the PR to land.
#   `just check` (on sting or honey, never neo) is the pre-queue signal.
# - `secrets-scan` runs the xoxd-ai/ci-templates secrets-scan action (TruffleHog
#   --only-verified, then gitleaks with .gitleaks.toml) over the full history
#   under the same gating, and `ci-ok` requires it too. `just secrets-scan` is
#   the pre-queue signal for a fork PR.
# - `spec-dhall` (R-C229 formal spec, R-C255) type-checks spec/dhall and
#   requires docs/releases/approved-broker.json, the generated broker
#   constants and the pinned owners.json snapshot to equal their Dhall
#   renderings. Interpreters only, no compile; same gating, and `ci-ok`
#   requires it. It reads the tree and writes only a private temp dir, so it
#   never changes a release-protected input (scripts/release-check.py
#   SOURCE_INPUTS_V1); the job fails if the checkout is left dirty.
#   `just spec-dhall` is the pre-queue signal.
# - `spec-quickcheck` and `spec-liquid` (R-C261) build the flake checks of
#   the same names: the Haskell model's QuickCheck properties, and the
#   LiquidHaskell refinement types in spec/haskell/src/Swb/Invariants.hs.
#   R-C261 puts them in `ci-ok` only if cheap. They are: every dependency,
#   LiquidHaskell included, substitutes from cache.nixos.org, and on sting
#   (2026-10-04, warm store) spec-liquid took 16 s and spec-quickcheck 48 s.
#   Same gating, and `ci-ok` requires both. `just spec-quickcheck` and
#   `just spec-liquid` on sting or honey are the pre-queue signals.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    uses: xoxd-ai/ci-templates/.github/workflows/rust-bazel-application.yml@ae836d8400d5784d74af4fecc020f225d1c2d08e # v5.1.1
    with:
      enabled: true
      runner_group: tinyland-infra
      required_bazel_major: "9"
      platform_matrix_json: >-
        [{"name":"linux-x86_64","os":"linux","arch":"x86_64","runner_labels":["tinyland-nix","Linux","X64"],"bazel_platform":"//platforms:x86_64-unknown-linux-gnu"}]
      rustfmt_targets_json: '["//:fmt"]'
      clippy_targets_json: '["//:clippy"]'
      build_targets_json: '["//:build"]'
      unit_test_targets_json: '["//:unit_tests"]'
      integration_test_targets_json: '["//:integration_tests"]'
      package_targets_json: '["//deploy:image", "//deploy:image.digest"]'
      timeout_minutes: 60
      max_parallel: 1

  secrets-scan:
    name: secrets-scan
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog and gitleaks
        uses: xoxd-ai/ci-templates/.github/actions/secrets-scan@ae836d8400d5784d74af4fecc020f225d1c2d08e # v5.1.1

  spec-dhall:
    name: spec-dhall
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Dhall type check and dhall-to-json freshness
        shell: bash
        run: |
          set -euo pipefail
          nix shell --inputs-from . nixpkgs#dhall nixpkgs#dhall-json nixpkgs#jq \
            --command bash spec/check-dhall.sh
      - name: Require an unchanged checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::spec-dhall changed the checkout"
            exit 1
          fi

  spec-quickcheck:
    name: spec-quickcheck
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the model and run the QuickCheck properties
        shell: bash
        run: nix build --no-link -L .#checks.x86_64-linux.spec-quickcheck

  spec-liquid:
    name: spec-liquid
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: LiquidHaskell refinement types
        shell: bash
        run: nix build --no-link -L .#checks.x86_64-linux.spec-liquid

  ci-ok:
    name: ci-ok
    needs: [rust, secrets-scan, spec-dhall, spec-quickcheck, spec-liquid]
    if: >-
      always()
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: tinyland-nix
    timeout-minutes: 5
    steps:
      - name: Aggregate the rust-bazel-application lane, secrets scan and spec checks
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          SPEC_DHALL_RESULT: ${{ needs.spec-dhall.result }}
          SPEC_QUICKCHECK_RESULT: ${{ needs.spec-quickcheck.result }}
          SPEC_LIQUID_RESULT: ${{ needs.spec-liquid.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} rust=${RUST_RESULT} secrets-scan=${SECRETS_RESULT} spec-dhall=${SPEC_DHALL_RESULT} spec-quickcheck=${SPEC_QUICKCHECK_RESULT} spec-liquid=${SPEC_LIQUID_RESULT}"
          if [[ "${RUST_RESULT}" != "success" ]]; then
            echo "::error::rust-bazel-application lane result is ${RUST_RESULT}"
            exit 1
          fi
          if [[ "${SECRETS_RESULT}" != "success" ]]; then
            echo "::error::secrets-scan result is ${SECRETS_RESULT}"
            exit 1
          fi
          if [[ "${SPEC_DHALL_RESULT}" != "success" ]]; then
            echo "::error::spec-dhall result is ${SPEC_DHALL_RESULT}"
            exit 1
          fi
          if [[ "${SPEC_QUICKCHECK_RESULT}" != "success" ]]; then
            echo "::error::spec-quickcheck result is ${SPEC_QUICKCHECK_RESULT}"
            exit 1
          fi
          if [[ "${SPEC_LIQUID_RESULT}" != "success" ]]; then
            echo "::error::spec-liquid result is ${SPEC_LIQUID_RESULT}"
            exit 1
          fi
          echo "ci-ok: rust-bazel-application lane, secrets scan and spec checks passed"
