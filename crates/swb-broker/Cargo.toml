[package]
name = "swb-broker"
description = "agent-switchboard broker: MCP (rmcp Streamable HTTP), REST /v1 and metrics - P1a stub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# R-C262: test-only time control for the spec live adapter. No production
# target enables it; see crates/swb-broker/src/lib.rs `test_clock`.
[features]
test-clock = []

[dependencies]
swb-proto = { path = "../swb-proto" }
swb-store = { path = "../swb-store" }
serde_json.workspace = true
rmcp.workspace = true
axum.workspace = true
tokio.workspace = true

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true
tower.workspace = true
