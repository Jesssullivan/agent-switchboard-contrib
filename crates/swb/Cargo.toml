[package]
name = "swb"
description = "agent-switchboard: the single swb binary (serve | agentd | hook | whoami | inbox) - P1a stub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "swb"
path = "src/main.rs"

# R-C262: test-only time control for the spec live adapter. No production
# target enables it; see crates/swb-broker/src/lib.rs `test_clock`.
[features]
test-clock = ["swb-broker/test-clock"]

[dependencies]
swb-agentd = { path = "../swb-agentd" }
swb-broker = { path = "../swb-broker" }
swb-proto = { path = "../swb-proto" }
swb-store = { path = "../swb-store" }
tokio.workspace = true
serde_json.workspace = true
